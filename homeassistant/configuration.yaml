#       command_topic: "govee/h7015/AABBCCDDEEFF/set"
#       availability_topic: "govee/h7015/AABBCCDDEEFF/availability"
#       brightness: true
#       brightness_scale: 100
#       color_mode: true
#       supported_color_modes: ["rgb", "color_temp"]
#       min_mireds: 154    # 6500K (cold)
#       max_mireds: 500    # 2000K (warm)
#       effect: true
#       effect_list:
#         # Classic built-in catalogue (individual H7015 field coverage is partial)
#         - sunrise
#         - sunset
#         - movie
#         - dating
#         - romantic
#         - twinkle
#         - candlelight
#         - breathe
#         - snowflake
#         - energetic
#         - crossing
#         - rainbow
#         # Experimental music modes
#         - music_energic
#         - music_spectrum
#         - music_rolling
#         - music_rhythm
#       device:
#         identifiers: ["govee_h7015_AABBCCDDEEFF"]
#         name: "Patio String Lights"
#         manufacturer: "Govee"
#         model: "H7015"
#         sw_version: "reverse-engineered"

# --- Example 2: Binary sensor for connectivity -----------------------------
mqtt:
  binary_sensor:
    - name: "Patio Lights Connected"
      unique_id: govee_h7015_aabbccddeeff_connected
      state_topic: "govee/h7015/AABBCCDDEEFF/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity

  sensor:
    - name: "Patio Lights Raw State"
      unique_id: govee_h7015_aabbccddeeff_raw
      state_topic: "govee/h7015/AABBCCDDEEFF/attributes"
      value_template: "{{ value_json.raw }}"
      icon: mdi:hexadecimal

# --- Example 3: Automation - turn patio lights on at sunset ----------------
automation:
  - id: govee_h7015_sunset_on
    alias: "Turn on patio lights at sunset"
    trigger:
      - platform: sun
        event: sunset
        offset: "-00:15:00"
    action:
      - service: light.turn_on
        target:
          entity_id: light.patio_string_lights
        data:
          brightness: 60
          color_temp: 370  # ~2700K warm white
    mode: single

  - id: govee_h7015_off_midnight
    alias: "Turn off patio lights at midnight"
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: light.turn_off
        target:
          entity_id: light.patio_string_lights
    mode: single

# --- Example 4: Per-bulb segment control via a script ----------------------
# Lets you set individual bulbs through the HA "Call Service" UI.
script:
  set_patio_bulb:
    alias: "Set patio bulb color"
    fields:
      bulb:
        description: "Bulb index 0-14"
        example: 0
      r:
        description: "Red 0-255"
        example: 255
      g:
        description: "Green 0-255"
        example: 0
      b:
        description: "Blue 0-255"
        example: 0
    sequence:
      - service: mqtt.publish
        data:
          topic: "govee/h7015/AABBCCDDEEFF/set"
          payload: >-
            {"cmd":"segment","bulb":{{ bulb }},"r":{{ r }},"g":{{ g }},"b":{{ b }}}
    mode: single
