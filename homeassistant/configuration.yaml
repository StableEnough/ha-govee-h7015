# =============================================================================
# Home Assistant configuration for the Govee H7015 MQTT bridge.
#
# The bridge (mqtt_bridge.py) publishes an MQTT discovery payload
# automatically, so you normally do NOT need to add anything to
# configuration.yaml -- the light will show up automatically under
# Settings -> Devices & Services -> MQTT.
#
# This file is provided for two cases:
#   1. You want to disable MQTT auto-discovery and configure the light
#      manually.
#   2. You want to add extra sensors / automations on top of the auto-
#      discovered light.
#
# Replace AABBCCDDEEFF with your H7015's MAC (uppercase, no colons).
# =============================================================================

# --- Example 1: Manual MQTT light (alternative to auto-discovery) ----------
# Uncomment and edit if you prefer explicit configuration.
#
# mqtt:
#   light:
#     - name: "Patio String Lights"
#       unique_id: govee_h7015_aabbccddeeff
