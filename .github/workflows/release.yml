name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate version consistency
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/govee_h7015_ble/manifest.json'))['version'])")
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          echo "manifest=$MANIFEST_VERSION pyproject=$PYPROJECT_VERSION tag=$TAG_VERSION"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ] || [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Installation

            ### Via HACS
            1. Add this repository to HACS (Integrations → Custom repositories)
            2. Install "Govee H7015 BLE"
            3. Restart Home Assistant

            ### Manual
            Copy `custom_components/govee_h7015_ble/` to your HA `custom_components/` directory.
