set_bulb:
  name: Set bulb color
  description: Set the color of a single bulb on a Govee H7015 string light.
  fields:
    device_id:
      name: Device
      description: H7015 string lights to control.
      required: true
      selector:
        device:
          filter:
            - integration: govee_h7015_ble
          multiple: true
    bulb:
      name: Bulb
      description: Bulb index (0-14, counting from the controller end).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 14
          step: 1
          mode: box
    rgb:
      name: RGB color
      description: RGB color as a list of three integers 0-255.
      required: true
      example: [255, 0, 0]
      selector:
        color_rgb: {}

snapshot_scene:
  name: Snapshot colors and brightness as scene
  description: >-
    Saves bulb colors and known whole-string and lit-bulb brightness using
    scene.create. Unknown levels are omitted and off bulbs remain off.
    Creates a temporary scene that lasts until HA restarts. Requires a target device.
  fields:
    device_id:
      name: Device
      description: H7015 string lights to snapshot.
      required: true
      selector:
        device:
          filter:
            - integration: govee_h7015_ble
          multiple: true
    scene_name:
      name: Scene name
      description: The name for the new scene (e.g. "Christmas", "Date Night").
      required: true
      example: Christmas
      selector:
        text:

send_raw:
  name: Send raw packet (diagnostic)
  description: >-
    Sends raw bytes to the lights for protocol testing. Give up to 19 bytes in
    hex (for example "33 05 02 FF 00 00"); the packet is zero-padded to 20
    bytes and the XOR checksum is appended. Nothing is validated against the
    protocol, and the light's state in Home Assistant is not updated.
  fields:
    device_id:
      name: Device
      description: H7015 string lights to send to.
      required: true
      selector:
        device:
          filter:
            - integration: govee_h7015_ble
          multiple: true
    hex:
      name: Hex bytes
      description: Up to 19 bytes in hex, spaces allowed.
      required: true
      example: "33 05 02 FF 00 00"
      selector:
        text:
