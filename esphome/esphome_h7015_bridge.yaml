# =============================================================================
# ESPHome config: ESP32 BLE -> MQTT bridge for Govee H7015.
#
# Use this when the H7015 is mounted outdoors and your HA server is too far
# away for a direct Bluetooth connection. Flash an ESP32 (e.g. ESP32-DevKitC,
# ESP32-C3 SuperMini, or any ESP32 with onboard Bluetooth) with this YAML.
#
# The ESP32 lives inside near the lights, talks BLE to the H7015, and bridges
# commands/state over WiFi/MQTT to Home Assistant.
#
# Requires ESPHome >= 2024.6.
#
# Setup:
#   1. Install ESPHome:  pip install esphome
#   2. Create secrets.yaml next to this file with:
#        wifi_ssid, wifi_password, mqtt_broker, mqtt_user, mqtt_password,
#        api_key, ota_password
#   3. Replace AABBCCDDEEFF in this file with your H7015's MAC (4 places).
#   4. esphome run esphome_h7015_bridge.yaml
# =============================================================================

esphome:
  name: govee-h7015-bridge
  friendly_name: Govee H7015 Bridge
  project:
    name: "govee.h7015_bridge"
    version: "1.0.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # Arduino works too; esp-idf is more stable for BLE

# ---- WiFi -------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "H7015-Bridge-Fallback"
    password: "configure-me"

captive_portal:

logger:
  level: INFO
  baud_rate: 0             # Free up UART0; logs go via API/Web

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant

# ---- BLE --------------------------------------------------------------------
esp32_ble_tracker:

# ---- BLE client connection --------------------------------------------------
# ESPHome's ble_client uses mac_address + id; the service_uuid is discovered
# automatically. We use ble_write actions to send packets to the write
# characteristic (UUID 00010203-0405-0607-0809-0a0b0c0d2b11).
ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"   # <-- replace with your H7015 MAC
    id: ble_client_h7015
    on_connect:
      then:
        - lambda: ESP_LOGI("ble", "H7015 connected");
        - mqtt.publish:
            topic: "govee/h7015/AABBCCDDEEFF/availability"
            payload: "online"
            retain: true
    on_disconnect:
      then:
        - lambda: ESP_LOGW("ble", "H7015 disconnected");
        - mqtt.publish:
            topic: "govee/h7015/AABBCCDDEEFF/availability"
            payload: "offline"
            retain: true

# ---- Reusable script actions for each command -------------------------------
# Each script first checks if the BLE client is connected, then builds a
# 20-byte Govee packet and writes it to the H7015's write characteristic.
# The checksum is XOR of bytes 0-18.
script:
  - id: send_power
    parameters:
      on: bool
    then:
      - if:
          condition:
            lambda: 'return id(ble_client_h7015)->connected();'
          then:
            - ble_write:
                characteristic_uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
                service_uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
                id: ble_client_h7015
                data: !lambda |-
                  uint8_t pkt[20] = {0};
                  pkt[0] = 0x33; pkt[1] = 0x01; pkt[2] = on ? 0x01 : 0x00;
                  uint8_t c = 0; for (int i=0;i<19;i++) c ^= pkt[i];
                  pkt[19] = c;
                  return std::vector<uint8_t>(pkt, pkt+20);

  - id: send_brightness
    parameters:
      value: int    # 0..100 percent
    then:
      - if:
          condition:
            lambda: 'return id(ble_client_h7015)->connected();'
          then:
            - ble_write:
                characteristic_uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
                service_uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
                id: ble_client_h7015
                data: !lambda |-
                  int v = value > 100 ? 100 : (value < 0 ? 0 : value);
                  uint8_t raw = (v == 0) ? 0 : (uint8_t)(0x14 + (0xFE - 0x14) * (v - 1) / 99);
                  uint8_t pkt[20] = {0};
                  pkt[0] = 0x33; pkt[1] = 0x04; pkt[2] = raw;
                  uint8_t c = 0; for (int i=0;i<19;i++) c ^= pkt[i];
                  pkt[19] = c;
                  return std::vector<uint8_t>(pkt, pkt+20);

  - id: send_color
    parameters:
      r: int
      g: int
      b: int
    then:
      - if:
          condition:
            lambda: 'return id(ble_client_h7015)->connected();'
          then:
            - ble_write:
                characteristic_uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
                service_uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
                id: ble_client_h7015
                data: !lambda |-
                  uint8_t pkt[20] = {0};
                  pkt[0] = 0x33; pkt[1] = 0x05; pkt[2] = 0x02;
                  pkt[3] = (uint8_t)(r > 255 ? 255 : (r < 0 ? 0 : r));
                  pkt[4] = (uint8_t)(g > 255 ? 255 : (g < 0 ? 0 : g));
                  pkt[5] = (uint8_t)(b > 255 ? 255 : (b < 0 ? 0 : b));
                  uint8_t c = 0; for (int i=0;i<19;i++) c ^= pkt[i];
                  pkt[19] = c;
                  return std::vector<uint8_t>(pkt, pkt+20);

  - id: send_keepalive
    then:
      - if:
          condition:
            lambda: 'return id(ble_client_h7015)->connected();'
          then:
            - ble_write:
                characteristic_uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
                service_uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
                id: ble_client_h7015
                data: !lambda |-
                  uint8_t pkt[20] = {0};
                  pkt[0] = 0xAA; pkt[1] = 0x01;
                  uint8_t c = 0; for (int i=0;i<19;i++) c ^= pkt[i];
                  pkt[19] = c;
                  return std::vector<uint8_t>(pkt, pkt+20);

# ---- Exposed entities (callable from HA) ------------------------------------
switch:
  - platform: template
    name: "Patio Lights Power"
    id: patio_power
    optimistic: true
    turn_on_action:
      - script.execute:
          id: send_power
          on: true
      - mqtt.publish:
          topic: "govee/h7015/AABBCCDDEEFF/state"
          payload: '{"state":"ON"}'
          retain: true
    turn_off_action:
      - script.execute:
          id: send_power
          on: false
      - mqtt.publish:
          topic: "govee/h7015/AABBCCDDEEFF/state"
          payload: '{"state":"OFF"}'
          retain: true

number:
  - platform: template
    name: "Patio Lights Brightness"
    id: patio_brightness
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      - script.execute:
          id: send_brightness
          value: !lambda "return (int)x;"

  - platform: template
    name: "Patio Lights Red"
    id: patio_red
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    initial_value: 255

  - platform: template
    name: "Patio Lights Green"
    id: patio_green
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    initial_value: 0

  - platform: template
    name: "Patio Lights Blue"
    id: patio_blue
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    initial_value: 0

button:
  - platform: template
    name: "Apply Patio Color"
    on_press:
      - script.execute:
          id: send_color
          r: !lambda "return (int)id(patio_red).state;"
          g: !lambda "return (int)id(patio_green).state;"
          b: !lambda "return (int)id(patio_blue).state;"

# ---- Keepalive loop ---------------------------------------------------------
interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(ble_client_h7015)->connected();'
          then:
            - script.execute: send_keepalive

# ---- Example secrets.yaml (create alongside this file) ---------------------
# wifi_ssid: "YourWiFi"
# wifi_password: "YourPassword"
# api_key: "32-byte-base64-api-key"
# ota_password: "ota-password"
# mqtt_broker: "192.168.1.10"
# mqtt_user: "mqtt-user"
# mqtt_password: "mqtt-password"
